<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t">
  <title id="t">頁面被 XSS 時，token 放 localStorage 會被偷走，放 HttpOnly cookie 偷不走但仍能被冒用</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="440" class="bg"/>

  <rect x="20" y="20" width="680" height="48" class="tag"/>
  <text x="40" y="50" font-size="16" font-weight="700" class="tagtext">前提：頁面被注入了惡意 JavaScript（XSS）</text>

  <!-- 左 -->
  <rect x="28" y="96" width="326" height="230" class="o"/>
  <rect x="20" y="88" width="326" height="230" class="card stroke" stroke-width="3"/>
  <text x="36" y="118" font-size="16" font-weight="700" class="fg">token 放 localStorage</text>
  <text x="36" y="150" font-size="13" class="mono mut">localStorage.getItem('token')</text>
  <text x="36" y="176" font-size="14" class="fg">直接讀出來，送到攻擊者的主機</text>
  <text x="36" y="214" font-size="15" font-weight="700" class="ink">被偷走</text>
  <text x="36" y="240" font-size="14" class="fg">攻擊者在自己的電腦上用，</text>
  <text x="36" y="262" font-size="14" class="fg">使用者關掉網頁也照樣能用，</text>
  <text x="36" y="284" font-size="14" class="fg">直到 token 過期</text>

  <!-- 右 -->
  <rect x="374" y="88" width="326" height="230" class="card stroke" stroke-width="2.5"/>
  <text x="390" y="118" font-size="16" font-weight="700" class="fg">token 放 HttpOnly cookie</text>
  <text x="390" y="150" font-size="13" class="mono mut">document.cookie</text>
  <text x="390" y="176" font-size="14" class="fg">讀不到 HttpOnly 的 cookie</text>
  <text x="390" y="214" font-size="15" font-weight="700" class="fg">偷不走，但能被冒用</text>
  <text x="390" y="240" font-size="14" class="fg">惡意程式在使用者的瀏覽器裡</text>
  <text x="390" y="262" font-size="14" class="fg">直接呼叫 API，cookie 自動帶上；</text>
  <text x="390" y="284" font-size="14" class="fg">網頁關掉就停了</text>

  <rect x="20" y="344" width="680" height="80" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="376" font-size="15" class="fg"><tspan font-weight="700">HttpOnly 縮小損害，但擋不住 XSS</tspan></text>
  <text x="40" y="402" font-size="14" class="mut">真正的防線是不讓 XSS 發生：輸出跳脫、不用 innerHTML 塞使用者內容、加 CSP</text>
</svg>
