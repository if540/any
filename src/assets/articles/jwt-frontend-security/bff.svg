<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t">
  <title id="t">兩種架構：前端自己拿 token 呼叫 API，以及 BFF 把 token 留在伺服器、瀏覽器只拿 session cookie</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="470" class="bg"/>

  <!-- A -->
  <text x="20" y="34" font-size="16" font-weight="700" class="fg">A. 前端自己拿 token</text>
  <rect x="20" y="50" width="200" height="110" class="card stroke" stroke-width="2.5"/>
  <text x="36" y="78" font-size="15" font-weight="700" class="fg">瀏覽器</text>
  <rect x="36" y="92" width="168" height="52" class="tag"/>
  <text x="50" y="114" font-size="13" font-weight="700" class="tagtext">JWT 在 JavaScript</text>
  <text x="50" y="134" font-size="13" class="tagtext">讀得到的地方</text>
  <path d="M222 105h236" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="340" y="96" font-size="13" text-anchor="middle" class="mono fg">Authorization: Bearer eyJ…</text>
  <rect x="470" y="50" width="230" height="110" class="card stroke" stroke-width="2.5"/>
  <text x="486" y="78" font-size="15" font-weight="700" class="fg">API</text>
  <text x="486" y="104" font-size="13" class="mut">驗證 JWT</text>
  <text x="20" y="186" font-size="14" class="ink" font-weight="700">XSS 可以把 token 偷走</text>

  <!-- B -->
  <text x="20" y="236" font-size="16" font-weight="700" class="fg">B. BFF（Backend for Frontend）</text>
  <rect x="20" y="252" width="190" height="120" class="card stroke" stroke-width="2.5"/>
  <text x="36" y="280" font-size="15" font-weight="700" class="fg">瀏覽器</text>
  <text x="36" y="306" font-size="13" class="fg">只有 session cookie</text>
  <text x="36" y="326" font-size="13" class="mut">HttpOnly、Secure、</text>
  <text x="36" y="344" font-size="13" class="mut">SameSite=Strict</text>
  <path d="M212 312h46" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="276" y="260" width="200" height="120" class="o"/>
  <rect x="268" y="252" width="200" height="120" class="card stroke" stroke-width="3"/>
  <text x="284" y="280" font-size="15" font-weight="700" class="fg">BFF（你的伺服器）</text>
  <text x="284" y="306" font-size="13" class="fg">用 cookie 找出 session，</text>
  <text x="284" y="326" font-size="13" font-weight="700" class="ink">token 存在這裡</text>
  <text x="284" y="346" font-size="13" class="fg">代替前端呼叫 API</text>
  <path d="M470 312h46" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="493" y="298" font-size="12" text-anchor="middle" class="mono fg">JWT</text>

  <rect x="526" y="252" width="174" height="120" class="card stroke" stroke-width="2.5"/>
  <text x="542" y="280" font-size="15" font-weight="700" class="fg">API</text>
  <text x="542" y="306" font-size="13" class="mut">驗證 JWT</text>
  <text x="20" y="398" font-size="14" class="fg" font-weight="700">token 從來不進瀏覽器，XSS 沒東西可偷</text>

  <rect x="20" y="414" width="680" height="44" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="442" font-size="14" class="fg">RFC 10017：處理商業、敏感或個人資料的應用，<tspan font-weight="700">強烈建議用 BFF</tspan></text>
</svg>
