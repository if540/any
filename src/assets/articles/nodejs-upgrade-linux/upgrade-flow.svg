<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t">
  <title id="t">升級 Node.js 後，Next.js 專案的四個步驟</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
    }
  </style>

  <rect width="720" height="470" class="bg"/>

  <!-- 1 -->
  <rect x="20" y="20" width="56" height="88" class="o"/>
  <text x="48" y="76" font-size="30" font-weight="900" text-anchor="middle" class="onO">1</text>
  <rect x="76" y="20" width="624" height="88" class="card stroke" stroke-width="3"/>
  <text x="96" y="54" font-size="20" font-weight="700" class="fg">照原本的方式升級 Node.js</text>
  <text x="96" y="86" font-size="16" class="mut">NodeSource 用 dnf／apt；symlink 就換 current</text>
  <path d="M48 108v20" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="20" y="132" width="56" height="88" class="o"/>
  <text x="48" y="188" font-size="30" font-weight="900" text-anchor="middle" class="onO">2</text>
  <rect x="76" y="132" width="624" height="88" class="card stroke" stroke-width="3"/>
  <text x="96" y="166" font-size="20" font-weight="700" class="fg">重裝依賴、重新 build</text>
  <text x="96" y="198" font-size="16" class="mono mut">rm -rf node_modules &amp;&amp; npm ci &amp;&amp; npm run build</text>
  <path d="M48 220v20" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="20" y="244" width="56" height="88" class="o"/>
  <text x="48" y="300" font-size="30" font-weight="900" text-anchor="middle" class="onO">3</text>
  <rect x="76" y="244" width="624" height="88" class="card stroke" stroke-width="3"/>
  <text x="96" y="278" font-size="20" font-weight="700" class="fg">重啟服務（不重啟就還是舊版）</text>
  <text x="96" y="310" font-size="16" class="mono mut">systemctl restart …／pm2 update</text>
  <path d="M48 332v20" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <rect x="20" y="356" width="56" height="100" class="o"/>
  <text x="48" y="418" font-size="30" font-weight="900" text-anchor="middle" class="onO">4</text>
  <rect x="76" y="356" width="624" height="100" class="card stroke" stroke-width="3"/>
  <text x="96" y="390" font-size="20" font-weight="700" class="fg">確認「正在跑的」是哪一版</text>
  <text x="96" y="422" font-size="16" class="mono mut">readlink /proc/&lt;PID&gt;/exe</text>
  <text x="96" y="444" font-size="15" class="ink" font-weight="700">node -v 只代表新開的程序</text>
</svg>
