<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="t">
  <title id="t">套件管理安裝和 symlink 安裝的檔案位置與升級方式</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}.mutstroke{stroke:#5e5e5e}
    .o{fill:#ff6b1a}.ostroke{stroke:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}.mutstroke{stroke:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="640" class="bg"/>

  <!-- ===== 左：套件管理 ===== -->
  <rect x="20" y="20" width="330" height="44" class="tag"/>
  <text x="36" y="49" font-size="19" font-weight="700" class="tagtext">套件管理（dnf／apt）</text>
  <text x="20" y="92" font-size="15" class="mut">NodeSource（Ubuntu、Rocky 都適用）</text>

  <rect x="20" y="108" width="330" height="72" class="card stroke" stroke-width="3"/>
  <text x="36" y="138" font-size="17" class="mono fg">/usr/bin/node</text>
  <text x="36" y="164" font-size="15" class="mut">實體檔案，屬於 nodejs 套件</text>

  <rect x="20" y="196" width="330" height="72" class="card stroke" stroke-width="3"/>
  <text x="36" y="226" font-size="17" class="mono fg">/usr/lib/node_modules/</text>
  <text x="36" y="252" font-size="15" class="mut">npm 與全域套件</text>

  <path d="M185 268v52" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="20" y="330" width="330" height="96" class="card stroke" stroke-width="3"/>
  <text x="36" y="362" font-size="18" font-weight="700" class="fg">升級：dnf／apt 原地覆蓋</text>
  <text x="36" y="390" font-size="15" class="mut">換主版本要先換套件庫</text>
  <text x="36" y="412" font-size="15" class="mut">一台機器同時只有一個版本</text>

  <!-- ===== 右：symlink ===== -->
  <rect x="370" y="20" width="330" height="44" class="tag"/>
  <text x="386" y="49" font-size="19" font-weight="700" class="tagtext">官方壓縮檔 + symlink</text>
  <text x="370" y="92" font-size="15" class="mut">手動管理，可以多版本並存</text>

  <rect x="370" y="108" width="330" height="72" class="card stroke" stroke-width="3"/>
  <text x="386" y="138" font-size="17" class="mono fg">/usr/local/bin/node</text>
  <text x="386" y="164" font-size="15" class="mut">symlink（捷徑）</text>

  <path d="M535 180v44" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="378" y="242" width="330" height="72" class="o"/>
  <rect x="370" y="234" width="330" height="72" class="card stroke" stroke-width="3"/>
  <text x="386" y="264" font-size="17" class="mono fg">/opt/nodejs/current</text>
  <text x="386" y="290" font-size="15" class="ink" font-weight="700">symlink，升級只改這裡</text>

  <path d="M470 306v64" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M620 306v64" class="mutstroke" stroke-width="3" fill="none" stroke-dasharray="7 6"/>
  <text x="482" y="346" font-size="14" font-weight="700" class="fg">現在</text>
  <text x="632" y="346" font-size="14" class="mut">回滾時</text>

  <rect x="370" y="380" width="160" height="88" class="card stroke" stroke-width="3"/>
  <text x="384" y="410" font-size="15" class="mono fg">node-v26.12.1</text>
  <text x="384" y="432" font-size="15" class="mono fg">-linux-x64/</text>
  <text x="384" y="456" font-size="14" class="mut">新版</text>

  <rect x="540" y="380" width="160" height="88" fill="none" class="mutstroke" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="554" y="410" font-size="15" class="mono mut">node-v24.22.1</text>
  <text x="554" y="432" font-size="15" class="mono mut">-linux-x64/</text>
  <text x="554" y="456" font-size="14" class="mut">舊版，先留著</text>

  <rect x="370" y="490" width="330" height="96" class="card stroke" stroke-width="3"/>
  <text x="386" y="522" font-size="18" font-weight="700" class="fg">升級：解壓新版，換 current</text>
  <text x="386" y="550" font-size="15" class="mut">回滾：把 current 指回舊版</text>
  <text x="386" y="572" font-size="15" class="mut">全域套件跟著版本資料夾走</text>

  <text x="20" y="620" font-size="15" class="mut">兩邊不要混用：同時存在時，PATH 先找到哪個就用哪個</text>
</svg>
