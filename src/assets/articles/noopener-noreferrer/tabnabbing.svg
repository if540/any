<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-labelledby="t">
  <title id="t">反向分頁劫持（tabnabbing）的三個步驟</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}.mutstroke{stroke:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    .code{fill:#24292e}.codetext{fill:#e1e4e8}.codestr{fill:#9ecbff}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}.mutstroke{stroke:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="620" class="bg"/>

  <!-- 1 -->
  <rect x="20" y="20" width="44" height="40" class="o"/>
  <text x="42" y="48" font-size="22" font-weight="900" text-anchor="middle" class="onO">1</text>
  <text x="78" y="48" font-size="20" font-weight="700" class="fg">在你的網站點了外部連結，開新分頁</text>

  <rect x="20" y="76" width="300" height="110" class="card stroke" stroke-width="3"/>
  <rect x="20" y="76" width="300" height="34" class="tag"/>
  <text x="34" y="99" font-size="16" class="mono tagtext">分頁 A：your-site.example</text>
  <text x="40" y="142" font-size="16" class="fg">你的網站</text>
  <text x="40" y="168" font-size="15" class="ink" font-weight="700">target="_blank" 的連結</text>

  <path d="M320 131h70" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="400" y="76" width="300" height="110" class="card stroke" stroke-width="3"/>
  <rect x="400" y="76" width="300" height="34" class="tag"/>
  <text x="414" y="99" font-size="16" class="mono tagtext">分頁 B：外部網站</text>
  <text x="420" y="142" font-size="16" class="fg">外部網站（可能被入侵、</text>
  <text x="420" y="166" font-size="16" class="fg">或本身就有惡意）</text>

  <!-- 2 -->
  <rect x="20" y="214" width="44" height="40" class="o"/>
  <text x="42" y="242" font-size="22" font-weight="900" text-anchor="middle" class="onO">2</text>
  <text x="78" y="242" font-size="20" font-weight="700" class="fg">分頁 B 透過 window.opener 改掉分頁 A</text>

  <rect x="20" y="270" width="680" height="64" class="code"/>
  <text x="40" y="309" font-size="18" class="mono codetext">window.opener.location = <tspan class="codestr">'https://假的登入頁'</tspan></text>

  <!-- 3 -->
  <rect x="20" y="362" width="44" height="40" class="o"/>
  <text x="42" y="390" font-size="22" font-weight="900" text-anchor="middle" class="onO">3</text>
  <text x="78" y="390" font-size="20" font-weight="700" class="fg">使用者切回分頁 A，看到「請重新登入」</text>

  <rect x="28" y="426" width="300" height="130" class="o"/>
  <rect x="20" y="418" width="300" height="130" class="card stroke" stroke-width="3"/>
  <rect x="20" y="418" width="300" height="34" class="tag"/>
  <text x="34" y="441" font-size="16" class="mono tagtext">分頁 A：已被換成假網站</text>
  <text x="40" y="486" font-size="17" font-weight="700" class="ink">工作階段逾時，請重新登入</text>
  <rect x="40" y="502" width="200" height="28" fill="none" class="mutstroke" stroke-width="2"/>
  <text x="50" y="522" font-size="14" class="mut">帳號、密碼…</text>

  <text x="350" y="470" font-size="16" class="fg">分頁標題、圖示都可以仿得一模一樣，</text>
  <text x="350" y="496" font-size="16" class="fg">使用者以為還在原本的網站，</text>
  <text x="350" y="522" font-size="16" class="fg">輸入的帳密就被偷走</text>

  <rect x="20" y="574" width="680" height="36" class="tag"/>
  <text x="36" y="598" font-size="16" font-weight="700" class="tagtext">noopener：讓分頁 B 拿到的 window.opener 是 null，第 2 步做不到</text>
</svg>
