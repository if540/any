<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="t">
  <title id="t">一個請求從瀏覽器到 Next.js，在 Rocky Linux 上經過的關卡</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="600" class="bg"/>

  <!-- 瀏覽器 -->
  <rect x="20" y="20" width="680" height="56" class="tag"/>
  <text x="40" y="55" font-size="20" font-weight="700" class="tagtext">瀏覽器：https://example.com</text>
  <path d="M120 76v32" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 1 firewalld -->
  <rect x="20" y="116" width="56" height="84" class="o"/>
  <text x="48" y="168" font-size="28" font-weight="900" text-anchor="middle" class="onO">1</text>
  <rect x="76" y="116" width="624" height="84" class="card stroke" stroke-width="3"/>
  <text x="96" y="148" font-size="19" font-weight="700" class="fg">firewalld：80、443 有沒有開？</text>
  <text x="96" y="180" font-size="15" class="mut">沒開 → 連線逾時；3000 不要對外開</text>
  <path d="M120 200v32" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 2 nginx -->
  <rect x="20" y="240" width="56" height="84" class="o"/>
  <text x="48" y="292" font-size="28" font-weight="900" text-anchor="middle" class="onO">2</text>
  <rect x="76" y="240" width="624" height="84" class="card stroke" stroke-width="3"/>
  <text x="96" y="272" font-size="19" font-weight="700" class="fg">nginx：處理 HTTPS，轉給 127.0.0.1:3000</text>
  <text x="96" y="304" font-size="15" class="mut">反向代理（reverse proxy）</text>
  <path d="M120 324v32" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 3 SELinux -->
  <rect x="20" y="364" width="56" height="84" class="o"/>
  <text x="48" y="416" font-size="28" font-weight="900" text-anchor="middle" class="onO">3</text>
  <rect x="76" y="364" width="624" height="84" class="card stroke" stroke-width="3"/>
  <text x="96" y="396" font-size="19" font-weight="700" class="fg">SELinux：nginx 可以連到 3000 嗎？</text>
  <text x="96" y="428" font-size="15" class="ink" font-weight="700">預設不行 → 502 Bad Gateway</text>
  <path d="M120 448v32" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 4 systemd + Next -->
  <rect x="20" y="488" width="56" height="92" class="o"/>
  <text x="48" y="544" font-size="28" font-weight="900" text-anchor="middle" class="onO">4</text>
  <rect x="76" y="488" width="624" height="92" class="card stroke" stroke-width="3"/>
  <text x="96" y="520" font-size="19" font-weight="700" class="fg">systemd 管理的 Next.js（next start，port 3000）</text>
  <text x="96" y="552" font-size="15" class="mut">開機自動啟動、當掉自動重啟、日誌用 journalctl 看</text>
</svg>
