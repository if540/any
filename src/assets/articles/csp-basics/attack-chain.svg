<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t">
  <title id="t">攻擊者注入內容之後的三個步驟，以及 CSP 在每一步擋住什麼</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="520" class="bg"/>

  <rect x="20" y="20" width="680" height="56" class="tag"/>
  <text x="40" y="46" font-size="16" font-weight="700" class="tagtext">前提：攻擊者已經把內容塞進頁面</text>
  <text x="40" y="66" font-size="13" class="tagtext">沒跳脫的輸出、innerHTML、AI 產生的 HTML……第一道防線已經失守</text>

  <path d="M120 78v24M360 78v24M600 78v24" class="stroke" stroke-width="2.5" fill="none"/>

  <!-- 三步 -->
  <rect x="28" y="118" width="200" height="226" class="o"/>
  <rect x="20" y="110" width="200" height="226" class="card stroke" stroke-width="3"/>
  <text x="36" y="138" font-size="16" font-weight="700" class="fg">① 執行程式</text>
  <text x="36" y="164" font-size="13" class="fg">注入 &lt;script&gt;</text>
  <text x="36" y="186" font-size="13" class="fg">行內事件 onerror</text>
  <text x="36" y="208" font-size="13" class="fg">載入外部惡意腳本</text>
  <text x="36" y="230" font-size="13" class="fg">用 &lt;base&gt; 劫持路徑</text>
  <text x="36" y="270" font-size="12" class="mut">CSP 指令</text>
  <text x="36" y="292" font-size="13" class="mono fg">script-src</text>
  <text x="36" y="314" font-size="13" class="mono fg">base-uri  object-src</text>

  <rect x="260" y="110" width="200" height="226" class="card stroke" stroke-width="2.5"/>
  <text x="276" y="138" font-size="16" font-weight="700" class="fg">② 把資料送出去</text>
  <text x="276" y="164" font-size="13" class="fg">&lt;img src="外站?d=…"&gt;</text>
  <text x="276" y="186" font-size="13" class="fg">fetch 到外站</text>
  <text x="276" y="208" font-size="13" class="fg">表單送到外站</text>
  <text x="276" y="230" font-size="12" class="mut">不用執行程式也做得到</text>
  <text x="276" y="270" font-size="12" class="mut">CSP 指令</text>
  <text x="276" y="292" font-size="13" class="mono fg">img-src  connect-src</text>
  <text x="276" y="314" font-size="13" class="mono fg">form-action</text>

  <rect x="500" y="110" width="200" height="226" class="card stroke" stroke-width="2.5"/>
  <text x="516" y="138" font-size="16" font-weight="700" class="fg">③ 騙使用者操作</text>
  <text x="516" y="164" font-size="13" class="fg">把你的網站嵌進</text>
  <text x="516" y="186" font-size="13" class="fg">別人的頁面，</text>
  <text x="516" y="208" font-size="13" class="fg">誘導點擊</text>
  <text x="516" y="230" font-size="12" class="mut">（點擊劫持）</text>
  <text x="516" y="270" font-size="12" class="mut">CSP 指令</text>
  <text x="516" y="292" font-size="13" class="mono fg">frame-ancestors</text>

  <rect x="20" y="360" width="680" height="72" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="390" font-size="15" class="fg"><tspan font-weight="700">CSP 擋不住的</tspan>：跳轉到外站。注入 <tspan class="mono">&lt;meta http-equiv="refresh"&gt;</tspan>，</text>
  <text x="40" y="414" font-size="14" class="mut">實測最完整的設定也照樣跳轉、把資料帶出去</text>

  <rect x="20" y="448" width="680" height="56" class="tag"/>
  <text x="40" y="474" font-size="15" font-weight="700" class="tagtext">CSP 是第二道防線：不阻止注入，而是讓注入的內容做不了事</text>
  <text x="40" y="494" font-size="13" class="tagtext">第一道防線還是輸出跳脫，以及 Trusted Types</text>
</svg>
