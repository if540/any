<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="t">
  <title id="t">升級五步驟：前三步在 v6 完成，第四步才換成 v7</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="460" class="bg"/>
  <rect x="20" y="20" width="100" height="220" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="70" y="122" font-size="15" font-weight="700" text-anchor="middle" class="fg">在 v6</text>
  <text x="70" y="144" font-size="15" font-weight="700" text-anchor="middle" class="fg">完成</text>
  <text x="70" y="170" font-size="12" text-anchor="middle" class="mut">可以分批上線</text>
<rect x="140" y="20" width="560" height="64" class="card stroke" stroke-width="2.5"/>
<circle cx="172" cy="52" r="16" class="tag"/><text x="172" y="58" font-size="15" font-weight="700" text-anchor="middle" class="tagtext">1</text>
<text x="200" y="48" font-size="15" font-weight="700" class="fg">升到 6.30.6</text>
<text x="200" y="70" font-size="13" class="mut">console 會列出還沒處理的 future flag 警告</text>
<rect x="148" y="104" width="552" height="64" class="o"/><rect x="140" y="98" width="552" height="64" class="card stroke" stroke-width="3"/>
<circle cx="172" cy="130" r="16" class="tag"/><text x="172" y="136" font-size="15" font-weight="700" text-anchor="middle" class="tagtext">2</text>
<text x="200" y="126" font-size="15" font-weight="700" class="fg">逐一開啟 future flags</text>
<text x="200" y="148" font-size="13" class="mut">每開一個就測試、commit；開完後行為已經和 v7 相同</text>
<rect x="140" y="176" width="560" height="64" class="card stroke" stroke-width="2.5"/>
<circle cx="172" cy="208" r="16" class="tag"/><text x="172" y="214" font-size="15" font-weight="700" text-anchor="middle" class="tagtext">3</text>
<text x="200" y="204" font-size="15" font-weight="700" class="fg">拿掉 v7 已移除的 API</text>
<text x="200" y="226" font-size="13" class="mut">json()、defer()、fallbackElement</text>
<rect x="20" y="256" width="100" height="142" class="tag"/>
  <text x="70" y="332" font-size="15" font-weight="700" text-anchor="middle" class="tagtext">換成 v7</text>
<rect x="140" y="256" width="560" height="64" class="card stroke" stroke-width="2.5"/>
<circle cx="172" cy="288" r="16" class="tag"/><text x="172" y="294" font-size="15" font-weight="700" text-anchor="middle" class="tagtext">4</text>
<text x="200" y="284" font-size="15" font-weight="700" class="fg">升 Node 20、React 18，換成 react-router@7</text>
<text x="200" y="306" font-size="13" class="mut">改 import：react-router-dom → react-router</text>
<rect x="140" y="334" width="560" height="64" class="card stroke" stroke-width="2.5"/>
<circle cx="172" cy="366" r="16" class="tag"/><text x="172" y="372" font-size="15" font-weight="700" text-anchor="middle" class="tagtext">5</text>
<text x="200" y="362" font-size="15" font-weight="700" class="fg">跑型別檢查、測試、npm audit</text>
<text x="200" y="384" font-size="13" class="mut">確認 v6 的已知漏洞已經消失</text>
  <text x="20" y="438" font-size="14" class="fg"><tspan font-weight="700">大部分工作在 v6 上就能完成</tspan>，真正換版本的那一步只剩改 import</text>
</svg>
