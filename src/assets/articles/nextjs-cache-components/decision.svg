<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t">
  <title id="t">開啟 Cache Components 後，每段程式該怎麼處理的判斷流程</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="560" class="bg"/>

  <rect x="20" y="16" width="320" height="48" class="tag"/>
  <text x="180" y="47" font-size="17" font-weight="700" text-anchor="middle" class="tagtext">這段程式要做什麼？</text>
  <path d="M180 66v22" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <rect x="20" y="96" width="320" height="76" class="card stroke" stroke-width="3"/>
  <text x="40" y="128" font-size="16" font-weight="700" class="fg">讀 cookies、headers、</text>
  <text x="40" y="154" font-size="16" font-weight="700" class="fg">searchParams？</text>
  <path d="M340 134h40" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="346" y="124" font-size="14" font-weight="700" class="fg">是</text>
  <rect x="388" y="96" width="312" height="76" class="card stroke" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="404" y="126" font-size="16" font-weight="700" class="fg">包進 &lt;Suspense&gt;</text>
  <text x="404" y="154" font-size="13" class="mut">讀出的值可以當參數傳給 'use cache'</text>
  <path d="M180 174v22" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="192" y="190" font-size="14" font-weight="700" class="fg">否</text>

  <!-- Q2 -->
  <rect x="20" y="204" width="320" height="76" class="card stroke" stroke-width="3"/>
  <text x="40" y="236" font-size="16" font-weight="700" class="fg">打 API、查資料庫、</text>
  <text x="40" y="262" font-size="16" font-weight="700" class="fg">讀會變的檔案？</text>
  <path d="M180 282v22" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="192" y="298" font-size="14" font-weight="700" class="fg">是</text>
  <path d="M340 242h40" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="346" y="232" font-size="14" font-weight="700" class="fg">否</text>
  <rect x="388" y="204" width="312" height="86" class="card stroke" stroke-width="2"/>
  <text x="404" y="232" font-size="15" class="fg">用到 new Date()、Math.random()？</text>
  <text x="404" y="258" font-size="13" class="mut">是：用 'use cache'，</text>
  <text x="404" y="276" font-size="13" class="mut">或 connection() + Suspense</text>

  <!-- Q3 -->
  <rect x="20" y="312" width="320" height="76" class="card stroke" stroke-width="3"/>
  <text x="40" y="344" font-size="16" font-weight="700" class="fg">每個人看到的都一樣，</text>
  <text x="40" y="370" font-size="16" font-weight="700" class="fg">而且可以舊一點？</text>
  <path d="M340 350h40" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="346" y="340" font-size="14" font-weight="700" class="fg">是</text>
  <rect x="396" y="320" width="312" height="96" class="o"/>
  <rect x="388" y="312" width="312" height="96" class="card stroke" stroke-width="3"/>
  <text x="404" y="342" font-size="16" font-weight="700" class="fg">'use cache'</text>
  <text x="404" y="368" font-size="14" class="mono fg">+ cacheLife() + cacheTag()</text>
  <text x="404" y="394" font-size="13" class="ink" font-weight="700">結果放進外殼，最快</text>
  <path d="M180 390v22" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="192" y="406" font-size="14" font-weight="700" class="fg">否，要最新</text>

  <!-- 結果：Suspense -->
  <rect x="20" y="420" width="320" height="76" class="card stroke" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="452" font-size="16" font-weight="700" class="fg">包進 &lt;Suspense&gt;</text>
  <text x="40" y="478" font-size="13" class="mut">每次請求都執行，串流補上</text>

  <text x="20" y="534" font-size="14" class="ink" font-weight="700">兩個都沒做 → next build 直接失敗，告訴你是哪一行</text>
</svg>
