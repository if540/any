<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="t">
  <title id="t">一行 log 讓 Apache 回 Proxy Error 的三條路：Node 行程掛掉、回應永遠不送出、太忙排隊逾時</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="600" class="bg"/>

  <!-- 鏈 -->
  <rect x="20" y="20" width="150" height="60" class="card stroke" stroke-width="2.5"/>
  <text x="95" y="56" font-size="16" font-weight="700" text-anchor="middle" class="fg">瀏覽器</text>
  <path d="M172 50h86" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="268" y="20" width="180" height="60" class="tag"/>
  <text x="358" y="48" font-size="16" font-weight="700" text-anchor="middle" class="tagtext">Apache</text>
  <text x="358" y="68" font-size="12" text-anchor="middle" class="mono tagtext">ProxyPass</text>
  <path d="M450 50h86" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="546" y="20" width="154" height="60" class="card stroke" stroke-width="2.5"/>
  <text x="623" y="48" font-size="16" font-weight="700" text-anchor="middle" class="fg">Node.js</text>
  <text x="623" y="68" font-size="12" text-anchor="middle" class="mut">Next.js、API</text>

  <text x="20" y="120" font-size="16" font-weight="700" class="fg">Node.js 裡的一行 log 出事，Apache 看到的是：</text>

  <!-- 1 -->
  <rect x="20" y="136" width="680" height="128" class="card stroke" stroke-width="2.5"/>
  <text x="40" y="166" font-size="13" font-weight="700" class="mut">路徑一 · log 那行丟錯，沒人接住</text>
  <text x="40" y="196" font-size="17" font-weight="700" class="fg">Node 行程掛掉</text>
  <text x="40" y="224" font-size="14" class="fg">正在處理的請求：<tspan class="ink" font-weight="700">502 Proxy Error</tspan>（Error reading from remote server）</text>
  <text x="40" y="248" font-size="14" class="fg">重啟完成前的請求：<tspan class="ink" font-weight="700">503 Service Unavailable</tspan>（連不上後端）</text>

  <!-- 2 -->
  <rect x="20" y="276" width="680" height="128" class="card stroke" stroke-width="2.5"/>
  <text x="40" y="306" font-size="13" font-weight="700" class="mut">路徑一 · 在 Next.js 的回呼裡丟錯</text>
  <text x="40" y="336" font-size="17" font-weight="700" class="fg">行程沒掛，但回應永遠不會送出</text>
  <text x="40" y="364" font-size="14" class="fg">Apache 一直等到 <tspan class="mono">ProxyTimeout</tspan>（預設 60 秒）：<tspan class="ink" font-weight="700">502 Proxy Error</tspan></text>
  <text x="40" y="388" font-size="13" class="mut">Next.js 會攔下這個錯誤，所以不會掛，反而更難發現</text>

  <!-- 3 -->
  <rect x="28" y="424" width="680" height="128" class="o"/>
  <rect x="20" y="416" width="680" height="128" class="card stroke" stroke-width="3"/>
  <text x="40" y="446" font-size="13" font-weight="700" class="mut">路徑二 · 每個請求都印很大的物件</text>
  <text x="40" y="476" font-size="17" font-weight="700" class="fg">單執行緒被 log 佔住，請求開始排隊</text>
  <text x="40" y="504" font-size="14" class="fg">排超過 <tspan class="mono">ProxyTimeout</tspan> 的請求：<tspan class="ink" font-weight="700">502 Proxy Error</tspan></text>
  <text x="40" y="528" font-size="13" class="mut">實測：50 個同時請求，300 個裡有 23 個逾時；log 檔一下長到 1 GB</text>

  <text x="20" y="580" font-size="14" class="mut">三條路的共同點：Node.js 這一端沒有在時間內給 Apache 一個完整的回應</text>
</svg>
