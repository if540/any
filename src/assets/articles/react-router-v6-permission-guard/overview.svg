<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t">
  <title id="t">守衛的整體設計：權限 API 只呼叫一次，同時供頁面守衛和元件守衛使用</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="520" class="bg"/>

  <rect x="200" y="20" width="320" height="56" class="tag"/>
  <text x="360" y="44" font-size="16" font-weight="700" text-anchor="middle" class="tagtext">權限 API</text>
  <text x="360" y="64" font-size="12" text-anchor="middle" class="mono tagtext">[{ id, unitName, sum }, …]</text>
  <path d="M360 78v26" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="208" y="120" width="320" height="76" class="o"/>
  <rect x="200" y="112" width="320" height="76" class="card stroke" stroke-width="3"/>
  <text x="360" y="142" font-size="16" font-weight="700" text-anchor="middle" class="fg">loadPermissions()</text>
  <text x="360" y="166" font-size="13" text-anchor="middle" class="fg">只呼叫 API 一次，結果共用</text>

  <path d="M280 190L170 238" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M440 190L550 238" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 左：頁面守衛 -->
  <rect x="20" y="246" width="320" height="200" class="card stroke" stroke-width="2.5"/>
  <text x="36" y="274" font-size="16" font-weight="700" class="fg">① 進入頁面：路由的 loader</text>
  <text x="36" y="298" font-size="13" class="mono mut">guard(Unit.Orders, Perm.Read)</text>
  <text x="36" y="330" font-size="14" class="fg">還沒登入（401）→ 導到登入頁</text>
  <text x="36" y="356" font-size="14" class="fg">沒有權限 → 丟出 403，</text>
  <text x="54" y="378" font-size="14" class="fg">由 errorElement 顯示</text>
  <text x="36" y="404" font-size="14" class="fg">有權限 → 執行頁面自己的 loader</text>
  <text x="36" y="432" font-size="13" font-weight="700" class="ink">頁面元件一次都不會渲染</text>

  <!-- 右：元件守衛 -->
  <rect x="380" y="246" width="320" height="200" class="card stroke" stroke-width="2.5"/>
  <text x="396" y="274" font-size="16" font-weight="700" class="fg">② 元件顯示：&lt;Can&gt;</text>
  <text x="396" y="298" font-size="13" class="mono mut">useRouteLoaderData('root')</text>
  <text x="396" y="330" font-size="14" class="fg">按鈕、欄位、選單項目</text>
  <text x="396" y="356" font-size="14" class="fg">沒有權限就不渲染，</text>
  <text x="396" y="378" font-size="14" class="fg">或改顯示替代內容</text>
  <text x="396" y="404" font-size="13" class="mono fg">&lt;Can unit need fallback&gt;</text>

  <rect x="20" y="466" width="680" height="40" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="492" font-size="14" class="fg"><tspan font-weight="700">兩者都只是使用體驗</tspan>：真正擋住請求的，是 API 自己的權限檢查</text>
</svg>
