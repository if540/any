<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t">
  <title id="t">守衛的整體設計：共用的三塊，加上依路由寫法不同的兩種頁面守衛</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="560" class="bg"/>

  <rect x="200" y="20" width="320" height="52" class="tag"/>
  <text x="360" y="42" font-size="16" font-weight="700" text-anchor="middle" class="tagtext">權限 API</text>
  <text x="360" y="62" font-size="12" text-anchor="middle" class="mono tagtext">[{ id, unitName, sum }, …]</text>
  <path d="M360 74v22" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 共用 -->
  <rect x="20" y="104" width="680" height="150" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="36" y="130" font-size="13" font-weight="700" class="mut">兩種路由寫法共用</text>
  <rect x="36" y="144" width="204" height="92" class="card stroke" stroke-width="2.5"/>
  <text x="50" y="172" font-size="15" font-weight="700" class="mono fg">can()</text>
  <text x="50" y="196" font-size="13" class="fg">位元判斷</text>
  <text x="50" y="218" font-size="12" class="mono mut">(sum &amp; need) === need</text>
  <rect x="266" y="152" width="204" height="92" class="o"/>
  <rect x="258" y="144" width="204" height="92" class="card stroke" stroke-width="3"/>
  <text x="272" y="172" font-size="15" font-weight="700" class="mono fg">loadPermissions()</text>
  <text x="272" y="196" font-size="13" class="fg">只呼叫 API 一次，</text>
  <text x="272" y="216" font-size="13" class="fg">結果共用</text>
  <rect x="480" y="144" width="204" height="92" class="card stroke" stroke-width="2.5"/>
  <text x="494" y="172" font-size="15" font-weight="700" class="fg">權限標在路由設定</text>
  <text x="494" y="196" font-size="12" class="mono mut">handle.permission</text>
  <text x="494" y="218" font-size="13" class="fg">withGuards() 自動套用</text>

  <path d="M250 256L190 296" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M470 256L530 296" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 頁面 -->
  <rect x="20" y="306" width="330" height="184" class="card stroke" stroke-width="2.5"/>
  <text x="36" y="334" font-size="16" font-weight="700" class="fg">① 進入頁面的守衛</text>
  <text x="36" y="364" font-size="14" font-weight="700" class="fg">&lt;BrowserRouter&gt;：上篇</text>
  <text x="36" y="386" font-size="13" class="fg">&lt;Guard&gt; 包住路由的 element</text>
  <path d="M36 402H334" class="stroke" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="36" y="428" font-size="14" font-weight="700" class="fg">data router：下篇</text>
  <text x="36" y="450" font-size="13" class="fg">守衛包住路由的 loader 和 action</text>
  <text x="36" y="474" font-size="13" font-weight="700" class="ink">沒登入 → 登入頁；沒權限 → 403</text>

  <!-- 元件 -->
  <rect x="370" y="306" width="330" height="184" class="card stroke" stroke-width="2.5"/>
  <text x="386" y="334" font-size="16" font-weight="700" class="fg">② 元件顯示的守衛</text>
  <text x="386" y="364" font-size="13" class="mono fg">&lt;Can unit need fallback&gt;</text>
  <text x="386" y="386" font-size="13" class="mono fg">useCan(unit, need)</text>
  <text x="386" y="418" font-size="13" class="fg">按鈕、欄位、選單項目，</text>
  <text x="386" y="440" font-size="13" class="fg">沒有權限就不渲染</text>
  <text x="386" y="474" font-size="13" class="mut">用法相同，只有權限的來源不同</text>

  <rect x="20" y="508" width="680" height="40" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="534" font-size="14" class="fg"><tspan font-weight="700">兩者都只是使用體驗</tspan>：真正擋住請求的，是 API 自己的權限檢查</text>
</svg>
