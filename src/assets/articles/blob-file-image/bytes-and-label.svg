<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="t">
  <title id="t">五種檔案都是「一串位元組加一張標籤」，差別在開頭的位元組</title>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    .code{fill:#24292e}.codetext{fill:#e1e4e8}.codehi{fill:#ff6b1a}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="600" class="bg"/>

  <!-- 圖例 -->
  <rect x="20" y="20" width="680" height="76" class="card stroke" stroke-width="3"/>
  <rect x="36" y="36" width="150" height="44" class="tag"/>
  <text x="111" y="64" font-size="16" text-anchor="middle" class="mono tagtext">type 標籤</text>
  <text x="200" y="64" font-size="22" font-weight="900" class="fg">+</text>
  <rect x="226" y="36" width="458" height="44" class="code"/>
  <text x="242" y="64" font-size="16" class="mono codetext"><tspan class="codehi">開頭的位元組</tspan> 後面的位元組……</text>

  <text x="20" y="130" font-size="17" font-weight="700" class="mut">實際打開五種檔案（數字是 16 進位的位元組）</text>

  <!-- txt -->
  <rect x="20" y="146" width="160" height="72" class="tag"/>
  <text x="36" y="176" font-size="15" class="mono tagtext">text/plain</text>
  <text x="36" y="202" font-size="14" class="tagtext">hello.txt</text>
  <rect x="180" y="146" width="520" height="72" class="code"/>
  <text x="196" y="178" font-size="16" class="mono codetext">e4 bd a0 e5 a5 bd 20 42 …</text>
  <text x="196" y="204" font-size="14" class="mono codetext">「你」「好」 B …（UTF-8 文字，沒有固定開頭）</text>

  <!-- png -->
  <rect x="20" y="230" width="160" height="72" class="tag"/>
  <text x="36" y="260" font-size="15" class="mono tagtext">image/png</text>
  <text x="36" y="286" font-size="14" class="tagtext">tiny.png</text>
  <rect x="180" y="230" width="520" height="72" class="code"/>
  <text x="196" y="262" font-size="16" class="mono codetext"><tspan class="codehi">89 50 4e 47</tspan> 0d 0a 1a 0a …</text>
  <text x="196" y="288" font-size="14" class="mono codetext"><tspan class="codehi">.PNG</tspan>：PNG 的固定開頭</text>

  <!-- jpg -->
  <rect x="20" y="314" width="160" height="72" class="tag"/>
  <text x="36" y="344" font-size="15" class="mono tagtext">image/jpeg</text>
  <text x="36" y="370" font-size="14" class="tagtext">tiny.jpg</text>
  <rect x="180" y="314" width="520" height="72" class="code"/>
  <text x="196" y="346" font-size="16" class="mono codetext"><tspan class="codehi">ff d8 ff</tspan> e0 00 10 4a 46 …</text>
  <text x="196" y="372" font-size="14" class="mono codetext"><tspan class="codehi">ff d8 ff</tspan>：JPEG 的固定開頭</text>

  <!-- mp3 -->
  <rect x="20" y="398" width="160" height="72" class="tag"/>
  <text x="36" y="428" font-size="15" class="mono tagtext">audio/mpeg</text>
  <text x="36" y="454" font-size="14" class="tagtext">beep.mp3</text>
  <rect x="180" y="398" width="520" height="72" class="code"/>
  <text x="196" y="430" font-size="16" class="mono codetext"><tspan class="codehi">49 44 33</tspan> 04 00 00 00 00 …</text>
  <text x="196" y="456" font-size="14" class="mono codetext"><tspan class="codehi">ID3</tspan>：mp3 開頭常見的標籤區</text>

  <!-- wav -->
  <rect x="20" y="482" width="160" height="72" class="tag"/>
  <text x="36" y="512" font-size="15" class="mono tagtext">audio/wav</text>
  <text x="36" y="538" font-size="14" class="tagtext">beep.wav</text>
  <rect x="180" y="482" width="520" height="72" class="code"/>
  <text x="196" y="514" font-size="16" class="mono codetext"><tspan class="codehi">52 49 46 46</tspan> 64 06 00 00 57 41 …</text>
  <text x="196" y="540" font-size="14" class="mono codetext"><tspan class="codehi">RIFF</tspan>….WAVE：WAV 的固定開頭</text>

  <text x="20" y="584" font-size="15" class="ink" font-weight="700">都是一串位元組；格式由內容的排列規則決定，標籤只是說明</text>
</svg>
