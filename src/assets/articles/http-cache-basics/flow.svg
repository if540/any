<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="720" height="660" role="img" aria-labelledby="t">
  <title id="t">瀏覽器要一個資源時的判斷流程：有沒有存、還新不新鮮、過期就向伺服器驗證</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="660" class="bg"/>

  <rect x="20" y="20" width="400" height="52" class="tag"/>
  <text x="40" y="52" font-size="17" font-weight="700" class="tagtext">瀏覽器需要某個網址的資源</text>
  <path d="M220 74v22" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <rect x="20" y="104" width="400" height="64" class="card stroke" stroke-width="2.5"/>
  <text x="40" y="132" font-size="16" font-weight="700" class="fg">快取裡有這個網址的回應嗎？</text>
  <text x="40" y="154" font-size="13" class="mut">上次的回應如果是 <tspan class="mono">no-store</tspan>，就不會有</text>
  <path d="M422 136h46" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="426" y="116" font-size="13" font-weight="700" class="fg">沒有</text>
  <rect x="478" y="104" width="222" height="64" class="card stroke" stroke-width="2.5"/>
  <text x="494" y="132" font-size="15" font-weight="700" class="fg">送一般請求</text>
  <text x="494" y="154" font-size="13" class="mut">伺服器回 200 和完整內容</text>

  <path d="M220 170v28" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="242" y="190" font-size="13" font-weight="700" class="fg">有</text>

  <!-- Q2 -->
  <rect x="20" y="206" width="400" height="64" class="card stroke" stroke-width="2.5"/>
  <text x="40" y="234" font-size="16" font-weight="700" class="fg">還新鮮嗎？</text>
  <text x="40" y="256" font-size="13" class="mut">存了多久，有沒有超過 <tspan class="mono">max-age</tspan></text>
  <path d="M422 238h46" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="426" y="218" font-size="13" font-weight="700" class="fg">新鮮</text>
  <rect x="486" y="212" width="222" height="64" class="o"/>
  <rect x="478" y="204" width="222" height="64" class="card stroke" stroke-width="3"/>
  <text x="494" y="232" font-size="15" font-weight="700" class="fg">直接用快取</text>
  <text x="494" y="254" font-size="13" font-weight="700" class="ink">完全不送請求</text>

  <path d="M220 272v28" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="242" y="292" font-size="13" font-weight="700" class="fg">過期，或回應標了 <tspan class="mono">no-cache</tspan></text>

  <!-- 驗證 -->
  <rect x="20" y="308" width="400" height="84" class="card stroke" stroke-width="2.5"/>
  <text x="40" y="336" font-size="16" font-weight="700" class="fg">向伺服器驗證：內容變了嗎？</text>
  <text x="40" y="360" font-size="13" class="mut">請求帶上次拿到的版本代號</text>
  <text x="40" y="380" font-size="13" class="mono mut">If-None-Match: "v1"</text>

  <path d="M130 394v38" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="152" y="416" font-size="13" font-weight="700" class="fg">沒變</text>
  <path d="M330 394v38" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="352" y="416" font-size="13" font-weight="700" class="fg">變了</text>

  <rect x="28" y="448" width="190" height="96" class="o"/>
  <rect x="20" y="440" width="190" height="96" class="card stroke" stroke-width="3"/>
  <text x="36" y="468" font-size="16" font-weight="700" class="fg">304 Not Modified</text>
  <text x="36" y="492" font-size="13" class="fg">沒有內容，只有標頭</text>
  <text x="36" y="512" font-size="13" font-weight="700" class="ink">繼續用快取那份，</text>
  <text x="36" y="530" font-size="13" font-weight="700" class="ink">重新計算新鮮期</text>

  <rect x="230" y="440" width="190" height="96" class="card stroke" stroke-width="2.5"/>
  <text x="246" y="468" font-size="16" font-weight="700" class="fg">200 OK</text>
  <text x="246" y="492" font-size="13" class="fg">完整的新內容</text>
  <text x="246" y="512" font-size="13" class="mut">換掉快取裡的舊版</text>

  <!-- 底部 -->
  <rect x="20" y="568" width="680" height="76" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="598" font-size="15" class="fg"><tspan font-weight="700">兩種省法</tspan>：新鮮時省掉整個請求；驗證後沒變，省掉內容的傳輸</text>
  <text x="40" y="624" font-size="14" class="mut">驗證還是要來回一趟，所以不會變的檔案，讓它「新鮮」得久一點最划算</text>
</svg>
