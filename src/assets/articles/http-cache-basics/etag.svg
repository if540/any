<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="t">
  <title id="t">ETag 時序圖：第一次拿到內容和版本號，之後帶版本號回去問，沒變回 304，變了回 200 和新版本號</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="640" class="bg"/>

  <!-- 角色 -->
  <rect x="20" y="20" width="150" height="44" class="tag"/>
  <text x="95" y="48" font-size="16" font-weight="700" text-anchor="middle" class="tagtext">瀏覽器</text>
  <rect x="550" y="20" width="150" height="44" class="tag"/>
  <text x="625" y="48" font-size="16" font-weight="700" text-anchor="middle" class="tagtext">伺服器</text>
  <path d="M95 66V620M625 66V620" class="stroke" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <!-- ① 第一次 -->
  <rect x="16" y="80" width="80" height="26" class="bg"/>
  <text x="20" y="98" font-size="14" font-weight="700" class="fg">① 第一次</text>
  <path d="M97 120H620" class="stroke" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="112" font-size="13" text-anchor="middle" class="mono fg">GET /app.js</text>
  <path d="M623 168H100" class="stroke" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="150" font-size="13" text-anchor="middle" class="mono fg">200 OK　ETag: "abc123"</text>
  <text x="360" y="190" font-size="13" text-anchor="middle" class="mut">附上完整內容 500 KB</text>
  <rect x="110" y="202" width="270" height="34" class="card stroke" stroke-width="2"/>
  <text x="124" y="224" font-size="13" class="fg">存起來：內容 ＋ <tspan class="mono">"abc123"</tspan></text>

  <!-- ② 沒改 -->
  <rect x="16" y="258" width="150" height="26" class="bg"/>
  <text x="20" y="276" font-size="14" font-weight="700" class="fg">② 過幾天，檔案沒改</text>
  <path d="M97 300H620" class="stroke" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="292" font-size="13" text-anchor="middle" class="mono fg">If-None-Match: "abc123"</text>
  <text x="360" y="320" font-size="13" text-anchor="middle" class="mut">「我手上是 abc123，有新的嗎？」</text>
  <rect x="440" y="330" width="170" height="30" class="card stroke" stroke-width="2"/>
  <text x="452" y="350" font-size="13" class="fg">比對：一樣</text>
  <path d="M623 380H100" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="372" font-size="14" font-weight="700" text-anchor="middle" class="mono ink">304 Not Modified</text>
  <rect x="118" y="402" width="300" height="36" class="o"/>
  <rect x="110" y="394" width="300" height="36" class="card stroke" stroke-width="2.5"/>
  <text x="124" y="418" font-size="13" font-weight="700" class="fg">沒有內容，繼續用手上那份</text>

  <!-- ③ 改了 -->
  <rect x="16" y="460" width="120" height="26" class="bg"/>
  <text x="20" y="478" font-size="14" font-weight="700" class="fg">③ 檔案改版之後</text>
  <path d="M97 502H620" class="stroke" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="494" font-size="13" text-anchor="middle" class="mono fg">If-None-Match: "abc123"</text>
  <rect x="440" y="512" width="170" height="30" class="card stroke" stroke-width="2"/>
  <text x="452" y="532" font-size="13" class="fg">比對：不一樣</text>
  <path d="M623 572H100" class="stroke" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="564" font-size="13" text-anchor="middle" class="mono fg">200 OK　ETag: "def456"</text>
  <text x="360" y="594" font-size="13" text-anchor="middle" class="mut">附上新內容，瀏覽器換掉舊的那份</text>
</svg>
