<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t">
  <title id="t">BDD 的三個部分：規格檔、步驟定義、受測的元件</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="470" class="bg"/>

  <!-- 規格檔 -->
  <rect x="28" y="28" width="250" height="250" class="o"/>
  <rect x="20" y="20" width="250" height="250" class="card stroke" stroke-width="3"/>
  <text x="36" y="48" font-size="16" font-weight="700" class="fg">① 規格檔</text>
  <text x="36" y="70" font-size="12" class="mono mut">permission-guard.feature</text>
  <text x="36" y="104" font-size="13" class="fg"><tspan font-weight="700">假設</tspan> 使用者在「訂單管理」</text>
  <text x="62" y="124" font-size="13" class="fg">的權限值是 3</text>
  <text x="36" y="152" font-size="13" class="fg"><tspan font-weight="700">當</tspan> 使用者進入「/orders」</text>
  <text x="36" y="180" font-size="13" class="fg"><tspan font-weight="700">那麼</tspan>「新增」按鈕顯示</text>
  <text x="36" y="208" font-size="13" class="fg"><tspan font-weight="700">而且</tspan>「刪除」按鈕不顯示</text>
  <text x="36" y="250" font-size="13" font-weight="700" class="ink">人人看得懂，也是需求文件</text>

  <path d="M282 145h42" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="303" y="134" font-size="12" text-anchor="middle" class="mut">一句</text>
  <text x="303" y="170" font-size="12" text-anchor="middle" class="mut">對一段</text>

  <!-- 步驟定義 -->
  <rect x="334" y="20" width="200" height="250" class="card stroke" stroke-width="2.5"/>
  <text x="350" y="48" font-size="16" font-weight="700" class="fg">② 步驟定義</text>
  <text x="350" y="70" font-size="12" class="mono mut">bdd.spec.tsx</text>
  <text x="350" y="104" font-size="13" class="fg">設定假的權限 API</text>
  <text x="350" y="124" font-size="13" class="fg">回應 sum = 3</text>
  <text x="350" y="152" font-size="13" class="fg">渲染 App 到 /orders</text>
  <text x="350" y="180" font-size="13" class="fg">檢查按鈕在不在</text>
  <text x="350" y="250" font-size="13" class="mut">工程師寫、工程師維護</text>

  <path d="M538 145h34" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- 元件 -->
  <rect x="580" y="20" width="120" height="250" class="tag"/>
  <text x="640" y="48" font-size="16" font-weight="700" text-anchor="middle" class="tagtext">③ 受測</text>
  <text x="640" y="104" font-size="13" text-anchor="middle" class="mono tagtext">&lt;Guard&gt;</text>
  <text x="640" y="132" font-size="13" text-anchor="middle" class="mono tagtext">&lt;Can&gt;</text>
  <text x="640" y="160" font-size="13" text-anchor="middle" class="mono tagtext">&lt;Nav&gt;</text>
  <text x="640" y="250" font-size="12" text-anchor="middle" class="tagtext">真正的元件</text>

  <rect x="20" y="296" width="680" height="156" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="326" font-size="15" font-weight="700" class="fg">規格檔和程式綁在一起，才不會各走各的</text>
  <text x="40" y="354" font-size="14" class="fg">規格多了一個場景，卻沒有對應的步驟定義 → 測試失敗</text>
  <text x="40" y="380" font-size="14" class="fg">步驟定義的文字跟規格檔對不上 → 測試失敗</text>
  <text x="40" y="406" font-size="14" class="fg">元件的行為跟規格不符 → 測試失敗，報告用規格的句子指出是哪一步</text>
  <text x="40" y="434" font-size="13" class="mut">三種脫節都會被抓到，所以規格檔永遠是「目前系統真正的行為」</text>
</svg>
