<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t">
  <title id="t">三種模式是一層包一層：Framework 包住 Data，Data 包住 Declarative</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="500" class="bg"/>

  <!-- Framework -->
  <rect x="20" y="20" width="680" height="400" class="card stroke" stroke-width="2.5"/>
  <text x="40" y="52" font-size="18" font-weight="700" class="fg">Framework</text>
  <text x="170" y="52" font-size="13" class="mono mut">Vite 外掛 ＋ routes.ts ＋ 路由模組</text>
  <text x="40" y="80" font-size="13" class="fg">加上：伺服器渲染、靜態產生、自動程式碼分割、型別安全的參數與 href()</text>

  <!-- Data -->
  <rect x="48" y="100" width="624" height="300" class="o"/>
  <rect x="40" y="92" width="624" height="300" class="card stroke" stroke-width="3"/>
  <text x="60" y="124" font-size="18" font-weight="700" class="fg">Data</text>
  <text x="130" y="124" font-size="13" class="mono mut">createBrowserRouter ＋ RouterProvider</text>
  <text x="60" y="152" font-size="13" class="fg">加上：loader、action、Form、useFetcher、useNavigation、errorElement</text>
  <text x="60" y="174" font-size="13" class="fg">路由定義搬到 React 元件樹外面</text>

  <!-- Declarative -->
  <rect x="60" y="194" width="584" height="178" class="tag"/>
  <text x="80" y="226" font-size="18" font-weight="700" class="tagtext">Declarative</text>
  <text x="210" y="226" font-size="13" class="mono tagtext">&lt;BrowserRouter&gt; ＋ &lt;Routes&gt;</text>
  <text x="80" y="256" font-size="13" class="tagtext">網址對應元件、巢狀路由與 &lt;Outlet /&gt;</text>
  <text x="80" y="280" font-size="13" class="tagtext">&lt;Link&gt;、&lt;NavLink&gt;、useNavigate、useParams、useSearchParams</text>
  <text x="80" y="320" font-size="13" class="tagtext">資料怎麼抓、載入中怎麼顯示，全部自己處理</text>
  <text x="80" y="344" font-size="13" class="tagtext">（useEffect、React Query、SWR……）</text>

  <text x="20" y="450" font-size="15" class="fg"><tspan font-weight="700">功能是疊加的</tspan>：往外一層，React Router 幫你做的事越多，</text>
  <text x="20" y="476" font-size="15" class="fg">你能自己決定的事越少</text>
</svg>
