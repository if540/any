<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t">
  <title id="t">React Router 版本與模式的時間軸</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg"/></marker></defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>
  <rect width="720" height="360" class="bg"/>
  <path d="M30 120H700" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <circle cx="70" cy="120" r="9" class="tag"/>
  <text x="70" y="94" font-size="15" font-weight="700" text-anchor="middle" class="mono fg">6.0</text>
  <text x="70" y="74" font-size="12" text-anchor="middle" class="mut">2021-11</text>
  <rect x="20" y="146" width="150" height="104" class="card stroke" stroke-width="2.5"/>
  <text x="34" y="172" font-size="14" font-weight="700" class="fg">Declarative</text>
  <text x="34" y="196" font-size="12" class="fg">&lt;BrowserRouter&gt;</text>
  <text x="34" y="216" font-size="12" class="fg">&lt;Routes&gt;</text>
  <text x="34" y="236" font-size="12" class="mono mut">react-router-dom</text>

  <circle cx="240" cy="120" r="9" class="tag"/>
  <text x="240" y="94" font-size="15" font-weight="700" text-anchor="middle" class="mono fg">6.4</text>
  <text x="240" y="74" font-size="12" text-anchor="middle" class="mut">2022-09</text>
  <rect x="180" y="146" width="150" height="104" class="card stroke" stroke-width="2.5"/>
  <text x="194" y="172" font-size="14" font-weight="700" class="fg">＋ Data</text>
  <text x="194" y="196" font-size="12" class="fg">createBrowserRouter</text>
  <text x="194" y="216" font-size="12" class="fg">loader、action</text>

  <circle cx="420" cy="120" r="9" class="tag"/>
  <text x="420" y="94" font-size="15" font-weight="700" text-anchor="middle" class="mono fg">7.0</text>
  <text x="420" y="74" font-size="12" text-anchor="middle" class="mut">2024-11</text>
  <rect x="340" y="146" width="170" height="104" class="card stroke" stroke-width="2.5"/>
  <text x="354" y="172" font-size="14" font-weight="700" class="fg">＋ Framework</text>
  <text x="354" y="196" font-size="12" class="fg">Remix 併入</text>
  <text x="354" y="216" font-size="12" class="fg">套件改名 react-router</text>
  <text x="354" y="236" font-size="12" class="mut">-dom 保留為轉接</text>

  <circle cx="610" cy="120" r="11" class="o"/>
  <text x="610" y="94" font-size="15" font-weight="700" text-anchor="middle" class="mono fg">8.0</text>
  <text x="610" y="74" font-size="12" text-anchor="middle" class="mut">2026-06</text>
  <rect x="528" y="154" width="172" height="104" class="o"/>
  <rect x="520" y="146" width="172" height="104" class="card stroke" stroke-width="3"/>
  <text x="534" y="172" font-size="14" font-weight="700" class="fg">三種模式都保留</text>
  <text x="534" y="196" font-size="12" class="fg">移除 react-router-dom</text>
  <text x="534" y="216" font-size="12" class="fg">middleware 成為預設</text>
  <text x="534" y="236" font-size="12" font-weight="700" class="ink">v6 停止維護（EOL）</text>

  <rect x="20" y="280" width="680" height="64" class="card stroke" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="308" font-size="14" class="fg"><tspan font-weight="700">模式和版本是兩件事</tspan>：v6 有 Declarative 和 Data，</text>
  <text x="40" y="330" font-size="14" class="fg">Framework 要 v7 以上；三種模式在 v8 都還在</text>
</svg>
