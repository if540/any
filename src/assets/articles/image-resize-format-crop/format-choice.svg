<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t">
  <title id="t">決定輸出格式的流程</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="470" class="bg"/>

  <!-- Q1 -->
  <rect x="20" y="20" width="420" height="92" class="card stroke" stroke-width="3"/>
  <text x="40" y="56" font-size="19" font-weight="700" class="fg">有裁切、縮小或旋轉嗎？</text>
  <text x="40" y="88" font-size="15" class="mut">都沒有，而且原檔大小符合上限</text>
  <path d="M440 66h86" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="56" font-size="17" font-weight="700" class="fg">沒有</text>
  <rect x="536" y="38" width="164" height="56" class="tag"/>
  <text x="618" y="73" font-size="18" font-weight="700" text-anchor="middle" class="tagtext">直接傳原檔</text>
  <path d="M120 112v40" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="134" y="140" font-size="17" font-weight="700" class="fg">有</text>

  <!-- Q2 -->
  <rect x="20" y="162" width="420" height="92" class="card stroke" stroke-width="3"/>
  <text x="40" y="198" font-size="19" font-weight="700" class="fg">真正的格式是 PNG？</text>
  <text x="40" y="230" font-size="15" class="mut">看檔案開頭的位元組，不要看副檔名</text>
  <path d="M440 208h86" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="198" font-size="17" font-weight="700" class="fg">是</text>
  <rect x="544" y="188" width="164" height="72" class="o"/>
  <rect x="536" y="180" width="164" height="72" class="card stroke" stroke-width="3"/>
  <text x="618" y="210" font-size="17" font-weight="700" text-anchor="middle" class="fg">輸出 PNG</text>
  <text x="618" y="236" font-size="14" text-anchor="middle" class="mut">可能有透明</text>
  <path d="M120 254v40" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="134" y="282" font-size="17" font-weight="700" class="fg">否（照片）</text>

  <!-- JPEG -->
  <rect x="28" y="312" width="672" height="140" class="o"/>
  <rect x="20" y="304" width="672" height="140" class="card stroke" stroke-width="3"/>
  <text x="40" y="340" font-size="19" font-weight="700" class="fg">輸出 JPEG，品質 0.8</text>
  <text x="40" y="372" font-size="16" class="mono mut">toBlob(cb, 'image/jpeg', 0.8)</text>
  <text x="40" y="402" font-size="15" class="mut">JPEG 沒有透明，Cropper.js 要設 fillColor</text>
  <text x="40" y="428" font-size="15" class="ink" font-weight="700">WebP 更小，但 Safari 的 canvas 不能輸出 WebP</text>
</svg>
