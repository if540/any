<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="t">
  <title id="t">串流回傳的 HTML，在瀏覽器和 FreeGo 眼中各是什麼樣子</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="fg"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.mut{fill:#5e5e5e}
    .o{fill:#ff6b1a}.ostroke{stroke:#ff6b1a}.tag{fill:#111111}.tagtext{fill:#fafaf7}
    .code{fill:#24292e}.codetext{fill:#e1e4e8}.codestr{fill:#9ecbff}.codecmt{fill:#959da5}.codetag{fill:#85e89d}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.mut{fill:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="760" class="bg"/>

  <!-- ===== 伺服器回傳的 HTML ===== -->
  <text x="20" y="34" font-size="22" font-weight="700" class="fg">伺服器回傳的 HTML（簡化）</text>
  <rect x="20" y="50" width="680" height="330" class="code"/>

  <text x="40" y="88" font-size="17" class="mono codetext">&lt;<tspan class="codetag">main</tspan>&gt;</text>
  <rect x="56" y="100" width="400" height="40" fill="none" class="ostroke" stroke-width="3"/>
  <text x="70" y="127" font-size="17" class="mono codetext">&lt;<tspan class="codetag">p</tspan>&gt;載入中…&lt;/<tspan class="codetag">p</tspan>&gt;</text>
  <text x="476" y="127" font-size="16" class="codecmt">← Suspense 的 fallback</text>
  <text x="40" y="168" font-size="17" class="mono codetext">&lt;/<tspan class="codetag">main</tspan>&gt;</text>

  <text x="40" y="210" font-size="16" class="codecmt">… 資料準備好之後才送出 …</text>

  <rect x="36" y="224" width="440" height="72" fill="none" class="ostroke" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="50" y="252" font-size="17" class="mono codetext">&lt;<tspan class="codetag">div</tspan> <tspan class="codestr">hidden</tspan> id=<tspan class="codestr">"S:0"</tspan>&gt;</text>
  <text x="70" y="282" font-size="17" class="mono codetext">&lt;<tspan class="codetag">h1</tspan>&gt;最新消息&lt;/<tspan class="codetag">h1</tspan>&gt; …</text>
  <text x="496" y="266" font-size="16" class="codecmt">← 真正的內容，</text>
  <text x="496" y="288" font-size="16" class="codecmt">　先藏起來</text>

  <text x="40" y="340" font-size="17" class="mono codetext">&lt;<tspan class="codetag">script</tspan>&gt;$RC(<tspan class="codestr">"B:0"</tspan>,<tspan class="codestr">"S:0"</tspan>)&lt;/<tspan class="codetag">script</tspan>&gt;</text>
  <text x="476" y="340" font-size="16" class="codecmt">← 搬內容的 JS</text>

  <!-- 分岔箭頭 -->
  <path d="M190 380v52" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M530 380v52" class="stroke" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- ===== 左：瀏覽器 ===== -->
  <rect x="20" y="444" width="330" height="40" class="tag"/>
  <text x="36" y="471" font-size="19" font-weight="700" class="tagtext">瀏覽器（會執行 JS）</text>
  <rect x="20" y="484" width="330" height="256" class="card stroke" stroke-width="3"/>
  <text x="40" y="524" font-size="18" class="fg">1. $RC 把藏起來的內容</text>
  <text x="40" y="550" font-size="18" class="fg">　 搬到「載入中…」的位置</text>
  <text x="40" y="590" font-size="18" class="fg">2. 接著水合，頁面可以互動</text>
  <text x="40" y="690" font-size="24" font-weight="900" class="fg">✓ 看得到 H1</text>

  <!-- ===== 右：FreeGo ===== -->
  <rect x="378" y="452" width="330" height="296" class="o"/>
  <rect x="370" y="444" width="330" height="40" class="tag"/>
  <text x="386" y="471" font-size="19" font-weight="700" class="tagtext">FreeGo（不執行 JS）</text>
  <rect x="370" y="484" width="330" height="256" class="card stroke" stroke-width="3"/>
  <text x="390" y="524" font-size="18" class="fg">只讀原始 HTML：</text>
  <text x="390" y="564" font-size="18" class="fg">・畫面上只有「載入中…」</text>
  <text x="390" y="604" font-size="18" class="fg">・H1 在 hidden 裡，</text>
  <text x="390" y="630" font-size="18" class="fg">　等同不存在</text>
  <text x="390" y="690" font-size="24" font-weight="900" class="ink">✗ 缺少 H1</text>
</svg>
