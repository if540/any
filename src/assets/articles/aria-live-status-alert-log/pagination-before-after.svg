<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" role="img" aria-labelledby="t">
  <title id="t">換頁搜尋結果的誤用與改寫，NVDA 報讀內容的比較</title>
  <style>
    .bg{fill:#fafaf7}.fg{fill:#111111}.stroke{stroke:#111111}.card{fill:#ffffff}
    .ink{fill:#b8430a}.inkstroke{stroke:#b8430a}.mut{fill:#5e5e5e}.mutstroke{stroke:#5e5e5e}
    .o{fill:#ff6b1a}.ostroke{stroke:#ff6b1a}
    .tag{fill:#111111}.tagtext{fill:#fafaf7}.onO{fill:#111111}
    text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
    .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#111111}.fg{fill:#fafaf7}.stroke{stroke:#fafaf7}.card{fill:#1b1b1b}
      .ink{fill:#ff6b1a}.inkstroke{stroke:#ff6b1a}.mut{fill:#a8a8a8}.mutstroke{stroke:#a8a8a8}
      .tag{fill:#fafaf7}.tagtext{fill:#111111}
    }
  </style>

  <rect width="720" height="780" class="bg"/>

  <!-- ===== 誤用 ===== -->
  <rect x="20" y="20" width="76" height="40" class="tag"/>
  <text x="58" y="48" font-size="22" font-weight="700" text-anchor="middle" class="tagtext">誤用</text>
  <text x="112" y="48" font-size="20" class="mono mut">整份清單都是 aria-live</text>

  <!-- live 範圍 -->
  <rect x="20" y="78" width="680" height="190" class="card"/>
  <rect x="20" y="78" width="680" height="190" fill="none" class="ostroke" stroke-width="5" stroke-dasharray="14 8"/>
  <text x="44" y="118" font-size="24" font-weight="900" class="fg">搜尋結果</text>
  <g class="mutstroke" stroke-width="10" stroke-linecap="round">
    <path d="M44 150h360M44 180h300M44 210h340"/>
  </g>
  <text x="44" y="250" font-size="20" class="mut">（共 10 筆）　‹ 上一頁　1　2　3　下一頁 ›</text>
  <text x="684" y="118" font-size="18" font-weight="700" text-anchor="end" class="ink">整塊都會被念</text>

  <!-- NVDA -->
  <path d="M60 290l16 -20 16 20" class="card stroke" stroke-width="3"/>
  <rect x="20" y="288" width="680" height="118" class="card stroke" stroke-width="3"/>
  <rect x="60" y="286" width="32" height="6" class="card"/>
  <text x="44" y="322" font-size="20" font-weight="700" class="mut">按下「下一頁」後，NVDA 報讀：</text>
  <text x="42" y="360" font-size="22" class="fg">「搜尋結果，第 11 筆……，第 12 筆……，第 13 筆……</text>
  <text x="42" y="392" font-size="22" class="fg">……第 20 筆……，上一頁，1，2，3，下一頁」</text>

  <path d="M20 440h680" class="stroke" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- ===== 改寫後 ===== -->
  <rect x="20" y="470" width="96" height="40" class="o"/>
  <text x="68" y="498" font-size="22" font-weight="700" text-anchor="middle" class="onO">改寫後</text>
  <text x="132" y="498" font-size="20" class="mono mut">只有一句 role="status"</text>

  <rect x="20" y="528" width="680" height="150" class="card stroke" stroke-width="3"/>
  <!-- status 句子 -->
  <rect x="38" y="542" width="248" height="40" fill="none" class="ostroke" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="50" y="570" font-size="22" font-weight="700" class="fg">第 2 頁，共 120 筆</text>
  <text x="684" y="570" font-size="18" font-weight="700" text-anchor="end" class="ink">只念這一句</text>
  <!-- 焦點在標題 -->
  <rect x="38" y="592" width="120" height="40" class="o"/>
  <text x="50" y="621" font-size="24" font-weight="900" class="onO">搜尋結果</text>
  <text x="172" y="621" font-size="18" font-weight="700" class="ink">← 焦點移到這裡</text>
  <g class="mutstroke" stroke-width="10" stroke-linecap="round">
    <path d="M50 656h340"/>
  </g>

  <path d="M60 700l16 -20 16 20" class="card stroke" stroke-width="3"/>
  <rect x="20" y="698" width="680" height="62" class="card stroke" stroke-width="3"/>
  <rect x="60" y="696" width="32" height="6" class="card"/>
  <text x="42" y="738" font-size="22" class="fg">「第 2 頁，共 120 筆」→「搜尋結果，標題層級 2」</text>
</svg>
